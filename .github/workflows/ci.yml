name: CI

# TODO(step-6a): trigger the workflow on push targeting the `main` branch.
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: workshop-app
  # After step-6d, your Docker Hub username will live in a secret.
  # For local tagging below we reference ${{ secrets.DOCKERHUB_USERNAME }}.

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TODO(step-6b): build the image locally with tag $IMAGE_NAME:${{ github.sha }}.
      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      # scan the freshly built image with Trivy. Fail the job on CRITICAL.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
            scan-type: image
            image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
            severity: CRITICAL
            exit-code: '1'
            ignore-unfixed: true

      # log in to Docker Hub using DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.
      - name: Log in to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # strip any stray whitespace/newlines saved with the secrets
          DH_USER=$(printf '%s' "$DH_USER" | tr -d '[:space:]')
          printf '%s' "$DH_TOKEN" | tr -d '[:space:]' | docker login -u "$DH_USER" --password-stdin

      # TODO(step-6e): tag and push the image as both :latest and :${{ github.sha }}.
      - name: Tag and push
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          FULL=$(printf '%s' "$DH_USER" | tr -d '[:space:]')/$IMAGE_NAME
          docker tag $IMAGE_NAME:${{ github.sha }} $FULL:${{ github.sha }}
          docker tag $IMAGE_NAME:${{ github.sha }} $FULL:latest
          docker push $FULL:${{ github.sha }}
          docker push $FULL:latest
